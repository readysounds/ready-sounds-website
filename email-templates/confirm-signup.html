<!-- Supabase "Confirm signup" email template -->
<div style="background-color:#0a0a0a; padding:40px 20px; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background-color:#1a1a1a; border:1px solid rgba(255,255,255,0.08); border-radius:12px; overflow:hidden;">
    <tr>
      <td style="padding:32px 32px 0 32px; text-align:center;">
        <span style="font-size:24px; font-weight:700; color:#ffffff;">ready<span style="color:#9c27b0;">sounds.</span></span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px 32px 8px 32px; text-align:center;">
        <h1 style="margin:0; font-size:20px; font-weight:600; color:#ffffff;">Confirm your email</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:8px 32px 24px 32px; text-align:center;">
        <p style="margin:0; font-size:15px; line-height:1.6; color:rgba(255,255,255,0.6);">
          Thanks for signing up for Ready Sounds. Click the button below to verify your email and activate your account.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px 32px; text-align:center;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 32px; background-color:#9c27b0; background-image:linear-gradient(135deg, #9c27b0, #4a148c); color:#ffffff; text-decoration:none; font-weight:600; font-size:15px; border-radius:8px;">
          Confirm Email
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px 32px; text-align:center;">
        <p style="margin:0; font-size:13px; color:rgba(255,255,255,0.4);">
          If you didn't create an account with Ready Sounds, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px; border-top:1px solid rgba(255,255,255,0.08); text-align:center;">
        <p style="margin:0; font-size:12px; color:rgba(255,255,255,0.3);">
          &copy; Ready Sounds &middot; <a href="https://readysounds.com" style="color:rgba(255,255,255,0.4); text-decoration:underline;">readysounds.com</a>
        </p>
      </td>
    </tr>
  </table>
</div>
