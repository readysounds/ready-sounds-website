<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Favorites - Ready Sounds</title>

    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 80px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #9c27b0;
            text-decoration: none;
            font-size: 1.1em;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ba68c8;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1em;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 30px;
        }

        .browse-btn {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #4a148c);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .browse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(156, 39, 176, 0.4);
        }

        .track-grid {
            display: grid;
            gap: 16px;
        }

        .track-item {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .track-item:hover {
            background: rgba(156, 39, 176, 0.1);
            border-color: rgba(156, 39, 176, 0.3);
            transform: translateY(-2px);
        }

        .track-artwork {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: rgba(156, 39, 176, 0.2);
        }

        .track-artwork img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9c27b0, #4a148c);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(156, 39, 176, 0.4);
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .track-meta {
            color: #888;
            font-size: 0.95em;
        }

        .track-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            background: rgba(156, 39, 176, 0.2);
            border-color: rgba(156, 39, 176, 0.3);
        }

        .unfavorite-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0;
        }

        .unfavorite-btn:hover {
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .track-item {
                flex-direction: column;
                text-align: center;
            }

            .track-actions {
                width: 100%;
                justify-content: center;
            }
        }

        /* ── Site nav ── */
        .rs-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10,10,10,0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
            padding: 16px 0;
        }
        .rs-nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rs-logo {
            font-size: 22px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            text-transform: lowercase;
        }
        .rs-nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }
        .rs-nav-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .rs-nav-links a:hover { color: #9c27b0; }
        .rs-nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .rs-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }
        @media (max-width: 768px) {
            .rs-nav-links { display: none; }
            .rs-menu-toggle { display: block; }
        }
    </style>
</head>
<body>
    <!-- Site Navigation -->
    <nav class="rs-nav">
        <div class="rs-nav-inner">
            <a href="browse.html" class="rs-logo">readysounds.</a>
            <div class="rs-nav-links">
                <a href="browse.html">Browse</a>
                <a href="playlists.html">Playlists</a>
                <a href="pricing.html">Pricing</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="rs-nav-right">
                <div class="profile-container" id="profileContainer">
                    <div class="profile-icon" id="profileIcon" onclick="toggleProfileDropdown()">
                        <span id="profileInitial">U</span>
                    </div>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-dropdown-header">My Media</div>
                        <a href="favorites.html" class="profile-dropdown-item"><span>Favorites</span></a>
                        <a href="my-playlists.html" class="profile-dropdown-item"><span>My Playlists</span></a>
                        <a href="playlists.html" class="profile-dropdown-item"><span>Curated Playlists</span></a>
                        <div class="profile-dropdown-divider"></div>
                        <a href="settings.html" class="profile-dropdown-item"><span>Account Settings</span></a>
                        <div class="profile-dropdown-divider"></div>
                        <a href="#" class="profile-dropdown-item" onclick="handleLogout(); return false;"><span>Sign Out</span></a>
                    </div>
                </div>
                <button class="rs-menu-toggle" id="mobileMenuToggle" onclick="toggleMobileMenu()" aria-label="Menu">☰</button>
            </div>
        </div>
    </nav>
    <!-- Mobile Panel Overlay -->
    <div class="mobile-panel-overlay" id="mobilePanelOverlay" onclick="closeMobilePanel()"></div>
    <!-- Mobile Slide Panel -->
    <div class="mobile-panel" id="mobilePanel">
        <button class="mobile-panel-close" onclick="closeMobilePanel()">✕</button>
        <nav class="mobile-panel-nav">
            <a href="browse.html">Browse</a>
            <a href="playlists.html">Playlists</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="pricing.html" class="mobile-panel-cta">Subscribe</a>
        <div class="mobile-panel-auth">
            <a href="signup.html?mode=signin" class="mobile-auth-login">Log In</a>
            <a href="signup.html" class="mobile-auth-signup">Create Free Account</a>
        </div>
        <div class="mobile-panel-footer">
            <a href="terms.html" style="color: rgba(255,255,255,0.4); font-size: 12px; text-decoration: none;">terms & conditions</a>
        </div>
    </div>

    <div class="container">
        <a href="browse.html" class="back-link">← Back to Browse</a>
        
        <header>
            <h1>My Favorites</h1>
            <p class="subtitle">Tracks you've loved</p>
        </header>

        <div id="favoritesContainer"></div>
    </div>

    <script>
        const emptyState = `
            <div class="empty-state">
                <div class="empty-state-icon">🤍</div>
                <div class="empty-state-text">You haven't favorited any tracks yet.</div>
                <a href="browse.html" class="browse-btn">Browse Music</a>
            </div>
        `;

        function escHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function loadFavorites() {
            const favoriteIds = JSON.parse(localStorage.getItem('readysounds_favorites') || '[]');
            const container = document.getElementById('favoritesContainer');

            if (favoriteIds.length === 0) {
                container.innerHTML = emptyState;
                return;
            }

            container.innerHTML = '<div style="text-align:center;padding:60px;color:#888;">Loading...</div>';

            try {
                const client = await window.RS.waitForClient();
                const { data: tracks, error } = await client
                    .from('tracks')
                    .select('id, title, artist, genre, bpm, duration, artwork_url')
                    .in('id', favoriteIds)
                    .eq('is_active', true);

                if (error) throw error;

                if (!tracks || tracks.length === 0) {
                    container.innerHTML = emptyState;
                    return;
                }

                // Index by id so we can render in localStorage order
                const trackMap = {};
                tracks.forEach(t => { trackMap[t.id] = t; });

                let html = '<div class="track-grid">';
                favoriteIds.forEach(trackId => {
                    const track = trackMap[trackId];
                    if (!track) return;
                    const displayTitle = `${escHtml(track.artist)} \u2014 &quot;${escHtml(track.title)}&quot;`;
                    html += `
                        <div class="track-item">
                            <div class="track-artwork">
                                ${track.artwork_url ? `<img src="${escHtml(track.artwork_url)}" alt="${displayTitle}">` : ''}
                            </div>
                            <button class="play-btn" onclick="playTrack(${track.id})">▶</button>
                            <div class="track-info">
                                <div class="track-title">${displayTitle}</div>
                                <div class="track-meta">${escHtml(track.genre || '')}${track.bpm ? ' · ' + escHtml(String(track.bpm)) + ' BPM' : ''}${track.duration ? ' · ' + escHtml(track.duration) : ''}</div>
                            </div>
                            <div class="track-actions">
                                <a href="browse.html#track-${track.id}" class="action-btn">View Track</a>
                                <button class="unfavorite-btn" onclick="removeFavorite(${track.id})">❤️</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (err) {
                console.error('Error loading favorites:', err);
                container.innerHTML = '<div style="text-align:center;padding:60px;color:#888;">Error loading favorites. Please try again.</div>';
            }
        }

        function removeFavorite(trackId) {
            let favorites = JSON.parse(localStorage.getItem('readysounds_favorites') || '[]');
            favorites = favorites.filter(id => id !== trackId);
            localStorage.setItem('readysounds_favorites', JSON.stringify(favorites));
            loadFavorites();
        }

        function playTrack(trackId) {
            window.location.href = `browse.html?play=${trackId}`;
        }

        document.addEventListener('DOMContentLoaded', loadFavorites);

        // Init nav auth using shared module
        window.RS.initNavAuth();
    </script>
</body>
</html>
